<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRA Staff Awards</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap" id="app"><p class="loading">Loading the awards…</p></div>
<div class="toast" id="toast" hidden></div>
<script src="/common.js"></script>
<script>
const state = { cfg: null, code: null, used: [], votes: {}, view: "gate", award: null, pick: null, busy: false };
const castFor = (id) => state.used.includes(id);

function render() {
  const a = $("#app");
  a.innerHTML = ({ gate, home, award: awardView, thanks })[state.view]();
  bind();
  window.scrollTo({ top: 0 });
}

function gate() {
  const c = state.cfg;
  return `${topbar(c)}
  <div class="stack spotlight">
    <div class="hero stack">
      <span class="eyebrow">Staff recognition 2026</span>
      <h1>Three awards, and the colleagues who earned them.</h1>
      <p class="muted" style="max-width:56ch">Your vote counts most when you tell us why. Choose who stands out for each award and share a real moment that shows it.</p>
      <blockquote class="vision"><span class="eyebrow">Our vision</span><p>${esc(c.vision)}</p></blockquote>
    </div>
    <div class="panel stack">
      ${c.closed ? `<div class="error-box">Voting is now closed. Thank you to everyone who took part.</div>` : `
      <div class="stack" style="gap:6px"><label for="code">Your personal voting code</label>
        <input id="code" autocomplete="off" placeholder="GRA-XXXXXX" style="text-transform:uppercase"></div>
      <div class="row"><button id="enter">Enter</button></div>`}
      <p class="muted" style="font-size:13px">Voting is anonymous: neither nominees nor management can see who cast a vote. Your code lets you vote once for each award. Data is used only to run these awards.</p>
    </div>
  </div>`;
}

function countdown() {
  const ms = new Date(state.cfg.closing) - new Date();
  if (ms <= 0) return "Voting closed";
  const d = Math.floor(ms / 864e5), h = Math.floor((ms % 864e5) / 36e5);
  return `${d} days ${h} hrs`;
}

function closingLabel() {
  return new Date(state.cfg.closing).toLocaleString("en-GB", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Indian/Mauritius" });
}

function home() {
  const c = state.cfg, n = c.awards.length, done = state.used.length;
  return `${topbar(c)}
  <div class="stack" style="gap:22px">
    <div class="stack" style="gap:6px"><span class="eyebrow">Welcome</span>
      <h1>${done === n ? "All three votes cast." : `${n - done} award${n - done > 1 ? "s" : ""} waiting for your vote.`}</h1>
      <p class="muted">Tap a card to see what it honours, then cast your vote.</p></div>
    <div class="meta">
      <div class="panel stack" style="gap:4px"><span class="eyebrow">Voting closes in</span><span class="count">${countdown()}</span><span class="muted" style="font-size:13px">${closingLabel()}</span></div>
      <div class="panel stack" style="gap:8px"><span class="eyebrow">Staff who have voted</span><span class="count">${c.participation}%</span><div class="bar"><i style="width:${c.participation}%"></i></div></div>
    </div>
    <div class="awards">${c.awards.map((aw) => {
      const cast = castFor(aw.id), v = state.votes[aw.id];
      return `<div class="flip ${cast ? "done" : ""}" style="--hue:var(${aw.hue})" data-flip="${aw.id}">
        <div class="flip-inner">
          <div class="face front">${EMBLEM[aw.id] || ""}<div class="txt stack" style="gap:4px">
            <span class="status">${cast ? (v ? "Voted for " + esc(v.name) : "Vote recorded") : "Tap to reveal"}</span>
            <h2>${esc(aw.name)}</h2><p class="muted">${esc(aw.honours)}</p></div></div>
          <div class="face back"><span class="eyebrow">Criteria set by management</span>
            ${aw.criteria.map((x) => `<h3>${esc(x)}</h3>`).join("")}
            <p class="muted" style="font-size:13px">From our mission: ${esc(aw.mission)}</p>
            <div class="row">${cast ? `<span class="status">Your vote is recorded and final</span>` : `<button data-open="${aw.id}">Vote for ${esc(aw.name)}</button>`}</div></div>
        </div></div>`;
    }).join("")}</div>
    <div class="row">${done === n ? `<button id="postcard">See my thank-you card</button>` : ""}<button class="ghost" id="logout">Sign out</button></div>
  </div>`;
}

function awardView() {
  const c = state.cfg, aw = c.awards.find((x) => x.id === state.award);
  return `<div style="--hue:var(${aw.hue});gap:22px" class="stack">
    ${topbar(c)}
    <div class="row"><button class="ghost" id="back">Back to awards</button></div>
    <div class="award-head">${EMBLEM[aw.id] || ""}<div class="txt" style="min-width:0">
      <span class="eyebrow">You are voting for</span><h1 style="font-size:32px">${esc(aw.name)}</h1>
      <p>${esc(aw.honours)}</p>
      <div class="criteria">${aw.criteria.map((x) => `<span class="crit">${esc(x)}</span>`).join("")}</div>
      <p class="muted" style="font-size:13px;margin-top:10px">Rooted in our mission: ${esc(aw.mission)}</p></div></div>

    <div class="stack" style="gap:10px;margin-top:22px">
      <h3>Step 1. Who stands out?</h3>
      <p class="muted">You can vote for anyone in the organisation. Write their full name as it appears on their badge or email.</p>
      <div class="nominee-form">
        <div class="stack" style="gap:6px"><label for="nname">Full name</label>
          <input id="nname" autocomplete="off" list="staffnames" placeholder="First name and surname" value="${state.pick ? esc(state.pick.name) : ""}">
          ${c.staff.length ? `<datalist id="staffnames">${c.staff.map((s) => `<option value="${esc(s.name)}">`).join("")}</datalist><span class="datalist-hint">Suggestions appear as you type.</span>` : ""}</div>
        <div class="stack" style="gap:6px"><label for="ndept">Department</label>
          <select id="ndept"><option value="">Select department</option>${c.departments.map((d) => `<option ${state.pick && state.pick.dept === d ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></div>
      </div>
      <div class="row"><button id="spot">Put them in the spotlight</button></div>
    </div>

    <div class="stack" id="why" style="gap:14px;margin-top:22px" hidden>
      <h3>Step 2. Tell us why</h3>
      <div class="picked" id="picked"></div>
      ${aw.prompts.map((p, i) => `<div class="stack" style="gap:6px"><label for="p${i}">${esc(p)}</label>
        <textarea id="p${i}" maxlength="1500" placeholder="A specific moment works best: when, what happened, who it helped."></textarea></div>`).join("")}
      <div class="stack" style="gap:6px"><span class="eyebrow">Strength of your justification</span>
        <div class="meter" id="meter"><span></span><span></span><span></span><span></span><span></span></div></div>
      <div class="nudge" id="nudge">Start writing and you will get a gentle tip here.</div>
      <label class="check"><input type="checkbox" id="merit"> I am voting on merit, based on the criteria above, not on friendship or popularity, and I am not voting for myself.</label>
      <p class="muted" style="font-size:13px">Once cast, this vote is final and cannot be changed.</p>
      <div class="row"><button id="submit" disabled>Cast my vote</button></div>
    </div>
  </div>`;
}

function thanks() {
  const c = state.cfg;
  return `${topbar(c)}<div class="stack" style="gap:20px">
    <div class="postcard stack" style="gap:10px"><div class="stamp">I VOTED<br>2026</div>
      <span class="eyebrow" style="color:inherit;opacity:.75">${esc(c.org)} Staff Awards</span>
      <h2>Thank you for voting.</h2>
      <p style="max-width:44ch;opacity:.9">Your three votes and the stories behind them now go to the jury. Recognition like this is how our values stay alive in daily work.</p>
      <div class="values">${c.awards.map((a) => `<span class="chip" style="background:transparent;color:inherit;border-color:currentColor">${esc(a.name)}</span>`).join("")}</div></div>
    <p class="muted">Screenshot this card and share it with your team to encourage others to vote.</p>
    <div class="row"><button class="ghost" id="home">Back to awards</button><button class="ghost" id="logout">Sign out</button></div></div>`;
}

function assess(texts) {
  const t = texts.join(" ").trim(), words = t.split(/\s+/).filter(Boolean).length;
  const specific = /\b(when|during|last|yesterday|week|month|meeting|file|case|client|licen|inspection|deadline|report|monday|tuesday|wednesday|thursday|friday|january|february|march|april|may|june|july|august|september|october|november|december|\d)/i.test(t);
  const generic = /\b(always|very nice|good person|helpful|kind|nice)\b/i.test(t) && !specific;
  let score = 0;
  if (words >= 8) score++; if (words >= 25) score++; if (words >= 45) score++;
  if (specific) score++; if (texts.every((x) => x.trim().split(/\s+/).filter(Boolean).length >= 6)) score++;
  let tip, good = false;
  if (!words) tip = "Start writing and you will get a gentle tip here.";
  else if (generic) tip = "This reads as a general impression. Can you recall one specific moment when you saw it?";
  else if (words < 25) tip = "Good start. Add what happened and who it helped, so the jury can picture it.";
  else if (!specific) tip = "Nearly there. A detail such as when it happened or which file or meeting would make it vivid.";
  else { tip = "This gives the jury a clear picture. Thank you."; good = true; }
  return { score, tip, good, ok: score >= 3 && words >= 15 };
}

function bind() {
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };

  const enter = async () => {
    if (state.busy) return;
    const code = $("#code").value.trim().toUpperCase();
    if (!code) return toast("Please enter your code.");
    state.busy = true;
    const r = await api("/api/enter", { method: "POST", body: JSON.stringify({ code }) });
    state.busy = false;
    if (!r.ok) return toast(r.data.error || "Something went wrong. Please try again.");
    state.code = code; state.used = r.data.used || []; state.votes = {}; state.view = "home"; render();
  };
  on("#enter", "click", enter);
  on("#code", "keydown", (e) => { if (e.key === "Enter") enter(); });

  document.querySelectorAll("[data-flip]").forEach((f) => f.addEventListener("click", (e) => { if (!e.target.closest("[data-open]")) f.classList.toggle("turned"); }));
  document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => {
    if (castFor(b.dataset.open)) return;
    state.award = b.dataset.open; state.pick = null; state.view = "award"; render();
  }));
  on("#back", "click", () => { state.view = "home"; render(); });
  on("#home", "click", () => { state.view = "home"; render(); });
  on("#postcard", "click", () => { state.view = "thanks"; render(); burst(); });
  on("#logout", "click", () => { state.code = null; state.used = []; state.votes = {}; state.view = "gate"; render(); });

  const showPicked = () => {
    const n = state.pick; $("#why").hidden = false;
    $("#picked").innerHTML = `<span class="avatar">${esc(initials(n.name))}</span><div><span class="eyebrow">In the spotlight</span><h3>${esc(n.name)}</h3><span class="muted">${esc(n.dept)}</span></div>`;
  };
  const update = () => {
    const tas = [...document.querySelectorAll("#why textarea")]; if (!tas.length) return;
    const r = assess(tas.map((t) => t.value));
    document.querySelectorAll("#meter span").forEach((s, i) => s.classList.toggle("on", i < r.score));
    const n = $("#nudge"); n.textContent = r.tip; n.classList.toggle("good", r.good);
    $("#submit").disabled = !(r.ok && $("#merit").checked && state.pick);
  };
  on("#nname", "input", () => {
    const val = norm($("#nname").value);
    const match = state.cfg.staff.find((s) => norm(s.name) === val);
    if (match && state.cfg.departments.includes(match.dept)) $("#ndept").value = match.dept;
    if (state.pick && val !== norm(state.pick.name)) { state.pick = null; $("#why").hidden = true; }
  });
  on("#spot", "click", () => {
    const name = $("#nname").value.trim().replace(/\s+/g, " "), dept = $("#ndept").value;
    if (name.split(" ").length < 2) return toast("Please write their first name and surname.");
    if (!dept) return toast("Please select their department.");
    state.pick = { name, dept }; showPicked(); update();
    $("#why").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
  });
  document.querySelectorAll("#why textarea").forEach((t) => t.addEventListener("input", update));
  on("#merit", "change", update);

  on("#submit", "click", async () => {
    if (state.busy || castFor(state.award)) return;
    const answers = [...document.querySelectorAll("#why textarea")].map((t) => t.value.trim());
    state.busy = true; $("#submit").disabled = true; $("#submit").textContent = "Saving your vote…";
    const r = await api("/api/vote", { method: "POST", body: JSON.stringify({ code: state.code, award: state.award, name: state.pick.name, dept: state.pick.dept, answers, merit: $("#merit").checked }) });
    state.busy = false;
    if (!r.ok) {
      $("#submit").textContent = "Cast my vote"; update();
      if (r.status === 409) { state.used = Array.from(new Set([...state.used, state.award])); state.view = "home"; render(); }
      return toast(r.data.error || "Your vote could not be saved. Please try again.");
    }
    state.used = r.data.used; state.votes[state.award] = state.pick;
    burst();
    if (state.used.length === state.cfg.awards.length) state.view = "thanks";
    else { state.view = "home"; toast("Vote cast. Thank you."); }
    render();
  });
}

(async function start() {
  const r = await api("/api/config");
  if (!r.ok) { $("#app").innerHTML = `<div class="error-box">The voting platform could not load. Please refresh the page in a moment.</div>`; return; }
  state.cfg = r.data; render();
  setInterval(() => { if (state.view === "home") { const el = document.querySelector(".count"); if (el) el.textContent = countdown(); } }, 60000);
})();
</script>
</body>
</html>
