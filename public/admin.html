<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRA Awards Jury</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap" id="app"><p class="loading">Loading…</p></div>
<div class="toast" id="toast" hidden></div>
<script src="/common.js"></script>
<script>
let cfg, key = "", data = null;

function login() {
  return `${topbar(cfg)}<div class="stack" style="gap:16px">
    <div><span class="eyebrow">Jury access</span><h1>Results</h1></div>
    <div class="panel stack"><div class="stack" style="gap:6px"><label for="key">Jury password</label>
      <input id="key" type="password" autocomplete="current-password"></div>
      <div class="row"><button id="go">Open results</button></div></div></div>`;
}

function tallies(aw) {
  const t = {};
  aw.votes.forEach((v) => { const k = norm(v.name); t[k] = t[k] || { name: v.name, depts: new Set(), c: 0 }; t[k].depts.add(v.dept); t[k].c++; });
  return Object.values(t).sort((a, b) => b.c - a.c);
}

function results() {
  const pct = data.headcount ? Math.round((data.voted / data.headcount) * 100) : 0;
  return `${topbar(cfg)}<div class="stack" style="gap:20px">
    <div class="row" style="justify-content:space-between"><div><span class="eyebrow">Jury view</span><h1>Live results</h1></div>
      <div class="row"><button class="ghost" id="refresh">Refresh</button><button id="csv">Download Excel file (CSV)</button></div></div>
    <div class="meta">
      <div class="panel stack" style="gap:4px"><span class="eyebrow">Staff who have voted</span><span class="count">${data.voted} of ${data.headcount}</span><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="panel stack" style="gap:4px"><span class="eyebrow">Codes issued</span><span class="count">${data.issued}</span><span class="muted" style="font-size:13px">Votes carry no code, time or device detail, and are shown in random order.</span></div>
    </div>
    <p class="muted">Names are grouped regardless of capital letters and spacing. Different spellings of the same person still appear on separate lines, so please reconcile them before announcing results.</p>
    ${data.awards.map((aw) => {
      const rows = tallies(aw), max = rows.length ? rows[0].c : 1;
      return `<div class="panel stack" style="--hue:var(${aw.hue});gap:12px">
        <div class="row">${(EMBLEM[aw.id] || "").replace('class="emblem"', 'class="emblem" style="width:44px;height:44px"')}<h2>${esc(aw.name)}</h2><span class="muted">${aw.votes.length} votes</span></div>
        <div class="tbl"><table><tr><th>Nominee</th><th>Votes</th><th style="width:40%"></th></tr>
          ${rows.map((r) => `<tr><td>${esc(r.name)}<br><small class="muted">${esc([...r.depts].join(", "))}</small></td><td>${r.c}</td><td><div class="bar"><i style="width:${(r.c / max) * 100}%;background:var(--hue)"></i></div></td></tr>`).join("") || `<tr><td colspan="3" class="muted">No votes yet.</td></tr>`}
        </table></div>
        <details><summary style="cursor:pointer;font-weight:600">Read the justifications</summary>
          <div class="stack" style="gap:12px;margin-top:12px">${aw.votes.map((v) => `<div class="stack" style="gap:4px;border-top:1px solid var(--line);padding-top:10px">
            <strong>${esc(v.name)} <span class="muted" style="font-weight:400">${esc(v.dept)}</span></strong>
            ${v.answers.map((a) => `<p>${esc(a)}</p>`).join("")}</div>`).join("")}</div></details>
      </div>`;
    }).join("")}
  </div>`;
}

function download() {
  const q = (x) => `"${String(x ?? "").replace(/"/g, '""')}"`;
  const lines = ["Award,Nominee,Department,Answer 1,Answer 2"];
  data.awards.forEach((aw) => aw.votes.forEach((v) => lines.push([aw.name, v.name, v.dept, ...v.answers].map(q).join(","))));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `GRA Awards Votes ${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

async function load() {
  const r = await api("/api/results", { headers: { "x-admin-key": key } });
  if (!r.ok) { toast(r.data.error || "Could not load results."); key = ""; return show(); }
  data = r.data; show();
}

function show() {
  $("#app").innerHTML = data && key ? results() : login();
  const on = (s, e, f) => { const el = $(s); if (el) el.addEventListener(e, f); };
  on("#go", "click", () => { key = $("#key").value; load(); });
  on("#key", "keydown", (e) => { if (e.key === "Enter") { key = $("#key").value; load(); } });
  on("#refresh", "click", load);
  on("#csv", "click", download);
}

(async () => {
  const r = await api("/api/config");
  cfg = r.ok ? r.data : { org: "GRA", values: [] };
  show();
})();
</script>
</body>
</html>
